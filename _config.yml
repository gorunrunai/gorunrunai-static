title: GoRunRun Local AI
description: A private AI assistant that runs entirely on your Mac and works completely offline. Open source, no account, no cloud.
url: https://gorunrunai.github.io   # the published address: canonical links and the sitemap use it
baseurl: ""
lang: en-US

remote_theme: just-the-docs/just-the-docs@v0.12.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-include-cache

color_scheme: gorunrun
logo: /assets/images/logo.svg
favicon_ico: /assets/images/favicon.ico
search_enabled: true
search:
  heading_level: 3
  button: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
mermaid:
  version: "11.4.1"

aux_links:
  "View on GitHub": https://github.com/gorunrunai/local-ai
aux_links_new_tab: true

footer_content: >-
  &copy; 2026 GoRunRun. All rights reserved. The <a href="https://github.com/gorunrunai/local-ai">GoRunRun Local AI app</a> is open source under the Apache License 2.0; this website is not.

gh_edit_link: false

callouts:
  note: { title: Note, color: blue }
  tip: { title: Tip, color: green }
  warning: { title: Heads up, color: yellow }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope: { path: "" }
    values: { layout: default }

# Fail the build on a broken page header instead of silently leaving the page out.
strict_front_matter: true
